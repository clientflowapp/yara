<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light only">
<title>moe lamkaddam · Termin anfragen</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#33202e">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="moe lamkaddam">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Karla:wght@400;500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --plum-ink:#33202e;      /* tiefes Aubergine – Grundton */
  --plum-soft:#5b3a52;     /* helleres Plum für Sekundäres */
  --blush:#f7efe9;         /* warmer Porzellan-Hintergrund */
  --blush-deep:#efe1d7;    /* Kartenflächen */
  --copper:#a85a3f;        /* gebranntes Kupfer – Akzent */
  --champagne:#b99a63;     /* feines Gold für Linien/Labels */
  --white:#fffdfb;
  --shadow:0 10px 30px rgba(51,32,46,.10);
  --radius:18px;
  --font-display:'Cormorant Garamond', 'Tajawal', serif;
  --font-body:'Karla', 'Tajawal', sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%; color-scheme:light; background:var(--blush)}
body{
  font-family:var(--font-body);
  background:var(--blush);
  color:var(--plum-ink);
  min-height:100vh;
  min-height:100dvh;
  display:flex;
  flex-direction:column;
}
body.rtl{direction:rtl}
body.rtl .step-body, body.rtl .summary-card{text-align:right}

/* ── Kopf ─────────────────────────────── */
header{
  padding:22px 22px 0;
  text-align:center;
}
.brand-logo{
  width:min(72%, 320px);
  max-height:130px;
  height:auto;
  object-fit:contain;
  margin:6px auto 0;display:block;
}
.brand{
  font-family:var(--font-display);
  font-size:1.55rem;
  font-weight:500;
  letter-spacing:.14em;
  text-transform:lowercase;
}
.brand span{color:var(--copper)}
.tagline{
  font-size:.68rem;
  letter-spacing:.32em;
  text-transform:uppercase;
  color:var(--champagne);
  margin-top:4px;
}
.rule{
  width:44px;height:1px;background:var(--champagne);
  margin:14px auto 0;
}

/* ── Fortschritt ──────────────────────── */
.progress{
  display:flex;justify-content:center;gap:8px;
  padding:16px 0 4px;
}
.progress i{
  width:26px;height:3px;border-radius:2px;
  background:var(--blush-deep);
  transition:background .35s;
}
.progress i.on{background:var(--copper)}

/* ── Bühne ────────────────────────────── */
main{
  flex:1;display:flex;flex-direction:column;
  max-width:520px;width:100%;
  margin:0 auto;
  padding:8px 20px calc(28px + env(safe-area-inset-bottom));
}
.step{display:none;animation:rise .45s ease both}
.step.active{display:flex;flex-direction:column;flex:1}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .step{animation:none}
  .lang-rotator span{animation:none !important}
}

.step-title{
  font-family:var(--font-display);
  font-size:1.7rem;
  font-weight:500;
  line-height:1.2;
  margin:14px 0 4px;
  text-align:center;
}
.step-sub{
  font-size:.9rem;color:var(--plum-soft);
  text-align:center;margin-bottom:18px;
  line-height:1.5;
}

/* ── Sprachwahl (Signature) ───────────── */
.lang-rotator{
  height:64px;display:flex;align-items:center;justify-content:center;
  overflow:hidden;position:relative;margin:6px 0 2px;
}
.lang-rotator span{
  position:absolute;
  font-family:var(--font-display);
  font-size:2.3rem;font-weight:500;font-style:italic;
  color:var(--copper);
  opacity:0;
  animation:cycle 15s infinite;
}
.lang-rotator span:nth-child(1){animation-delay:0s}
.lang-rotator span:nth-child(2){animation-delay:2.5s}
.lang-rotator span:nth-child(3){animation-delay:5s}
.lang-rotator span:nth-child(4){animation-delay:7.5s}
.lang-rotator span:nth-child(5){animation-delay:10s}
.lang-rotator span:nth-child(6){animation-delay:12.5s}
@keyframes cycle{
  0%,3%{opacity:0;transform:translateY(10px)}
  5%,14%{opacity:1;transform:none}
  16%,100%{opacity:0;transform:translateY(-10px)}
}
.lang-grid{
  display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;
}
.lang-btn{
  background:var(--white);
  border:1px solid var(--blush-deep);
  border-radius:var(--radius);
  padding:15px 12px;
  font-family:var(--font-body);
  color:var(--plum-ink);
  cursor:pointer;
  box-shadow:var(--shadow);
  transition:transform .15s, border-color .15s, background .15s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.lang-flag{
  width:20px;height:14px;border-radius:2px;overflow:hidden;
  box-shadow:0 1px 2px rgba(51,32,46,.15);
  display:block;opacity:.9;
}
.lang-flag svg{display:block;width:100%;height:100%}
.ll-label{font-size:1rem;font-weight:600;line-height:1}
.ll-code{
  font-size:.6rem;letter-spacing:.22em;
  color:var(--champagne);
}
.lang-btn:active{transform:scale(.97)}
.lang-btn:focus-visible, .svc:focus-visible, .btn:focus-visible, .chip:focus-visible{
  outline:2px solid var(--copper);outline-offset:2px;
}

/* ── Services ─────────────────────────── */
.svc-list{display:flex;flex-direction:column;gap:10px}
.svc{
  background:var(--white);
  border:1px solid var(--blush-deep);
  border-radius:var(--radius);
  padding:14px 16px;
  cursor:pointer;
  color:var(--plum-ink);
  display:flex;align-items:center;gap:12px;
  text-align:inherit;font-family:var(--font-body);
  box-shadow:0 4px 14px rgba(51,32,46,.06);
  transition:border-color .15s, transform .12s;
  width:100%;
}
.svc-name{font-weight:700;font-size:.95rem;color:var(--plum-ink)}
.svc:active{transform:scale(.985)}
.svc.selected{border-color:var(--copper);background:#fdf7f2}
.svc-emoji{font-size:1.3rem;flex:0 0 auto}
.svc-info{flex:1;min-width:0}
.svc-name{font-weight:700;font-size:.95rem}
.svc-meta{
  font-size:.78rem;color:var(--plum-soft);margin-top:2px;
  display:flex;flex-wrap:wrap;gap:4px 10px;
}
.svc-meta b{color:var(--copper);font-weight:700}
.price-note{
  font-size:.75rem;color:var(--plum-soft);
  background:var(--blush-deep);
  border-radius:12px;padding:10px 14px;
  margin-top:14px;line-height:1.5;
}

/* ── Formulare ────────────────────────── */
.step-body{display:flex;flex-direction:column;gap:14px}
textarea, input[type=text]{
  width:100%;
  background:var(--white);
  border:1px solid var(--blush-deep);
  border-radius:var(--radius);
  padding:14px 16px;
  font-family:var(--font-body);
  font-size:1rem;color:var(--plum-ink);
  resize:none;
}
textarea{min-height:110px}
textarea:focus, input:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:transparent}
.hint{
  font-size:.8rem;color:var(--plum-soft);line-height:1.5;
  display:flex;gap:8px;align-items:flex-start;
}
.hint .ico{flex:0 0 auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{
  border:1px solid var(--blush-deep);
  background:var(--white);
  border-radius:999px;
  padding:8px 14px;
  font-size:.85rem;font-family:var(--font-body);
  color:var(--plum-ink);cursor:pointer;
  transition:border-color .15s;
}
.chip.selected{border-color:var(--copper);background:#fdf7f2;color:var(--copper);font-weight:700}

/* ── Zusammenfassung ──────────────────── */
.summary-card{
  background:var(--white);
  border:1px solid var(--blush-deep);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.summary-card .sc-head{
  background:var(--plum-ink);
  color:var(--blush);
  font-family:var(--font-display);
  font-size:1.15rem;letter-spacing:.06em;
  padding:14px 18px;
}
.sc-row{
  padding:13px 18px;
  border-top:1px solid var(--blush);
}
.sc-row:first-of-type{border-top:none}
.sc-label{
  font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;
  color:var(--champagne);margin-bottom:3px;
}
.sc-value{font-size:.95rem;line-height:1.45;word-wrap:break-word}

/* ── Buttons ──────────────────────────── */
.actions{
  margin-top:auto;
  padding-top:20px;
  display:flex;flex-direction:column;gap:10px;
}
.btn{
  border:none;border-radius:999px;
  padding:16px 20px;
  font-family:var(--font-body);
  font-size:1rem;font-weight:700;
  cursor:pointer;width:100%;
  transition:transform .12s, opacity .15s;
}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--copper);color:var(--white)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--plum-soft);font-weight:500;padding:10px}
.btn-wa{background:#1faa59;color:#fff;display:flex;align-items:center;justify-content:center;gap:9px}
.btn-wa svg{width:20px;height:20px;fill:#fff}
.wa-note{font-size:.78rem;color:var(--plum-soft);text-align:center;line-height:1.5}

/* ── Foto-Upload ──────────────────────── */
.photo-box{color:var(--plum-ink);
  border:1.5px dashed var(--champagne);
  border-radius:var(--radius);
  background:var(--white);
  padding:16px;
  display:flex;align-items:center;gap:14px;
  cursor:pointer;
  transition:border-color .15s;
  width:100%;font-family:var(--font-body);
  text-align:inherit;
}
.photo-box:active{border-color:var(--copper)}
.photo-box .pb-ico{font-size:1.5rem;flex:0 0 auto}
.photo-box .pb-txt{flex:1;min-width:0}
.photo-box .pb-title{font-weight:700;font-size:.9rem;color:var(--plum-ink)}
.photo-box .pb-sub{font-size:.76rem;color:var(--plum-soft);margin-top:2px;line-height:1.4}
.photo-preview{
  position:relative;border-radius:var(--radius);overflow:hidden;
  box-shadow:var(--shadow);
}
.photo-preview img{display:block;width:100%;max-height:260px;object-fit:cover}
.photo-preview .pp-remove{
  position:absolute;top:10px;inset-inline-end:10px;
  background:rgba(51,32,46,.75);color:#fff;
  border:none;border-radius:999px;
  width:34px;height:34px;font-size:1rem;
  cursor:pointer;line-height:1;
}
.photo-preview .pp-change{
  position:absolute;bottom:10px;inset-inline-end:10px;
  background:rgba(255,253,251,.92);color:var(--plum-ink);
  border:none;border-radius:999px;
  padding:8px 14px;font-size:.78rem;font-weight:700;
  font-family:var(--font-body);cursor:pointer;
}
.sc-thumb{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:0 0 auto}
.sc-row.with-thumb{display:flex;align-items:center;gap:12px}
.upload-err{
  font-size:.78rem;color:#a33;background:#fbeaea;
  border-radius:10px;padding:9px 12px;line-height:1.4;
}
.btn .spin{
  display:inline-block;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.4);border-top-color:#fff;
  border-radius:50%;animation:sp .7s linear infinite;
  vertical-align:-3px;margin-inline-end:8px;
}
@keyframes sp{to{transform:rotate(360deg)}}

/* ── Menü (Yara) & Icon-Set ───────────── */
.yara-intro{
  text-align:center;margin:4px 0 6px;
}
.yara-mark{
  width:52px;height:52px;border-radius:50%;
  background:var(--plum-ink);
  color:var(--champagne);
  font-family:var(--font-display);
  font-size:1.5rem;font-style:italic;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 10px;
  letter-spacing:.02em;
}
.yara-avatar-wrap{
  width:96px;height:96px;border-radius:50%;overflow:hidden;
  margin:0 auto 12px;
  box-shadow:0 6px 18px rgba(51,32,46,.18);
  border:2px solid var(--white);
}
.yara-avatar{
  width:100%;height:100%;display:block;
  object-fit:cover;object-position:center 20%;
  transform:scale(1.4);transform-origin:center 20%;
}
.menu-list{display:flex;flex-direction:column;gap:12px;margin-top:8px}
.countdown{
  display:flex;align-items:center;justify-content:center;gap:8px;
  font-size:.82rem;font-weight:500;
  padding:9px 16px;border-radius:999px;
  width:fit-content;max-width:100%;margin:0 auto 4px;
  letter-spacing:.01em;
}
.countdown.here{background:#eef5ec;color:#3f6b3a}
.countdown.last{background:#f6e6dd;color:#a85a3f}
.countdown.soon{background:var(--blush-deep);color:var(--plum-soft)}
.cd-dot{
  width:7px;height:7px;border-radius:50%;background:currentColor;flex:0 0 auto;
  animation:cdPulse 2s ease-in-out infinite;
}
@keyframes cdPulse{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ .cd-dot{animation:none;opacity:.8} }
.nador-note{
  font-size:.78rem;line-height:1.5;
  color:var(--plum-soft);
  background:var(--blush-deep);
  border-radius:12px;
  padding:11px 14px;
  margin-top:16px;
  text-align:center;
}
.a2hs{
  position:relative;
  display:flex;align-items:center;gap:12px;
  background:var(--white);
  border:1px solid var(--blush-deep);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:13px 14px;margin-top:16px;
}
.a2hs-ico img{width:40px;height:40px;border-radius:10px;display:block}
.a2hs-txt{flex:1;min-width:0}
.a2hs-title{font-weight:700;font-size:.86rem;color:var(--plum-ink)}
.a2hs-steps{font-size:.76rem;color:var(--plum-soft);margin-top:2px;line-height:1.45}
.a2hs-share{width:15px;height:15px;vertical-align:-3px;color:#0a84ff;margin-inline-start:2px}
.a2hs-x{
  position:absolute;top:8px;inset-inline-end:10px;
  background:none;border:none;cursor:pointer;
  color:var(--champagne);font-size:.9rem;line-height:1;padding:2px;
}
.btn-ig{
  margin-top:10px;
  background:transparent;
  border:1px solid var(--blush-deep);
  color:var(--plum-soft);
  font-weight:500;
  display:flex;align-items:center;justify-content:center;gap:9px;
  text-decoration:none;
}
.btn-ig svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.6}
@media (hover:hover){ .btn-ig:hover{border-color:var(--copper);color:var(--copper)} }
.menu-btn{color:var(--plum-ink);
  background:var(--white);
  border:1px solid var(--blush-deep);
  border-radius:var(--radius);
  padding:18px;
  display:flex;align-items:center;gap:15px;
  cursor:pointer;width:100%;
  font-family:var(--font-body);text-align:inherit;
  box-shadow:var(--shadow);
  transition:transform .12s, border-color .15s;
}
.menu-btn:active{transform:scale(.98)}
.menu-btn .mb-title{font-weight:700;font-size:1rem;color:var(--plum-ink)}
.menu-btn .mb-sub{font-size:.78rem;color:var(--plum-soft);margin-top:2px}
.ico{
  width:42px;height:42px;flex:0 0 auto;
  border-radius:12px;
  background:var(--blush);
  display:flex;align-items:center;justify-content:center;
  color:var(--copper);
}
.ico svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.svc .ico{width:38px;height:38px;border-radius:10px}
.svc .ico svg{width:20px;height:20px}
.price-table{display:flex;flex-direction:column;gap:0;background:var(--white);border:1px solid var(--blush-deep);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.pt-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:13px 16px;border-top:1px solid var(--blush)}
.pt-row:first-child{border-top:none}
.pt-name{color:var(--plum-ink);font-size:.9rem;font-weight:500}
.pt-name small{display:block;font-size:.72rem;color:var(--plum-soft);font-weight:400;margin-top:1px}
.pt-price{font-size:.85rem;font-weight:700;color:var(--copper);white-space:nowrap}

/* ── Hover (nur auf Geräten mit echter Maus) ── */
@media (hover:hover){
  .lang-btn:hover, .svc:hover, .menu-btn:hover, .photo-box:hover{
    border-color:var(--copper); background:#fdf7f2;
  }
  .btn-primary:hover{background:#8f4c34}
  .btn-wa:hover{background:#1b9850}
  .btn-ghost:hover{color:var(--copper)}
  .chip:hover{border-color:var(--copper)}
  .faq-q:hover{color:var(--copper)}
  .pt-row:hover{background:#fdf7f2}
}

/* ── FAQ ──────────────────────────────── */
.faq-list{display:flex;flex-direction:column;gap:0;background:var(--white);border:1px solid var(--blush-deep);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
.faq-item{border-top:1px solid var(--blush)}
.faq-item:first-child{border-top:none}
.faq-q{
  width:100%;text-align:inherit;font-family:var(--font-body);
  background:none;border:none;cursor:pointer;
  padding:15px 16px;font-size:.92rem;font-weight:500;color:var(--plum-ink);
  display:flex;justify-content:space-between;align-items:center;gap:12px;
  transition:color .15s;
}
.faq-q .fq-plus{color:var(--copper);font-size:1.2rem;flex:0 0 auto;transition:transform .2s;line-height:1}
.faq-item.open .fq-plus{transform:rotate(45deg)}
.faq-a{
  max-height:0;overflow:hidden;
  transition:max-height .25s ease, padding .25s ease;
  font-size:.88rem;line-height:1.55;color:var(--plum-soft);
  padding:0 16px;
}
.faq-item.open .faq-a{max-height:260px;padding:0 16px 15px}

/* ── Datumsfelder & Verfügbarkeit ─────── */
.avail-info{
  font-size:.85rem;line-height:1.5;
  border-radius:12px;padding:11px 14px;margin-bottom:16px;
  text-align:center;
}
.avail-info.here{background:#eef5ec;color:#3f6b3a}
.avail-info.soon{background:var(--blush-deep);color:var(--plum-soft)}
.avail-info.away{background:#fbeaea;color:#a33}
.date-row{display:flex;gap:10px}
.date-field{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:5px}
.date-field span{
  font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--champagne);
  padding-inline-start:2px;
}
.date-field input[type=date]{
  width:100%;min-width:0;box-sizing:border-box;
  background:var(--white);
  border:1px solid var(--blush-deep);border-radius:var(--radius);
  padding:14px 10px;font-family:var(--font-body);font-size:.95rem;
  color:var(--plum-ink);
}
.date-field input[type=date]:focus{outline:2px solid var(--copper);outline-offset:1px;border-color:transparent}
@media (max-width:360px){ .date-row{flex-direction:column} }
.live-chip{width:100%;padding:13px}

.later-note{
  font-size:.76rem;line-height:1.5;
  color:var(--plum-soft);
  text-align:center;
  padding:2px 6px;margin-top:2px;
}

/* ── Abschluss-Screen ─────────────────── */
.done-wrap{text-align:center;padding-top:32px}
.done-check{
  width:88px;height:88px;margin:0 auto 18px;
}
.done-check svg{width:100%;height:100%;fill:none;stroke:var(--copper);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.done-check circle{
  stroke-dasharray:151;stroke-dashoffset:151;
  animation:drawCircle .55s ease forwards;
}
.done-check path{
  stroke-dasharray:40;stroke-dashoffset:40;
  animation:drawCheck .4s .45s ease forwards;
}
@keyframes drawCircle{to{stroke-dashoffset:0}}
@keyframes drawCheck{to{stroke-dashoffset:0}}
.done-reopen{font-size:.85rem}
@media (prefers-reduced-motion:reduce){
  .done-check circle,.done-check path{animation:none;stroke-dashoffset:0}
}

footer{
  text-align:center;
  font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;
  color:var(--champagne);
  padding:0 0 14px;
}
</style>
</head>
<body>

<header>
  <img class="brand-logo" id="brandLogo" alt="moe lamkaddam" src="">
  <div class="brand" id="brandText" style="display:none">moe <span>lamkaddam</span></div>

/* Sanftes haptisches Feedback (nur wo vom Gerät unterstützt) */
function buzz(ms){ try{ if(navigator.vibrate) navigator.vibrate(ms); }catch(e){} }

/* "Zum Startbildschirm hinzufügen"-Hinweis – plattformgerecht, einmalig, nicht im App-Modus */
function isStandalone(){
  try{ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true; }catch(e){ return false; }
}
function a2hsSeen(){
  try{ return localStorage.getItem('yara_a2hs')==='1'; }catch(e){ return a2hsMem; }
}
function a2hsMark(){
  try{ localStorage.setItem('yara_a2hs','1'); }catch(e){ a2hsMem=true; }
}
let a2hsMem=false; /* Fallback, falls localStorage blockiert ist */
function platform(){
  const ua = navigator.userAgent||"";
  if(/iPhone|iPad|iPod/i.test(ua)) return "ios";
  if(/Android/i.test(ua)) return "android";
  return "other";
}
function maybeShowA2HS(container){
  if(isStandalone() || a2hsSeen()) return;
  const p = platform();
  if(p==="other") return; /* Desktop braucht keinen Homescreen-Hinweis */
  const ML = m();
  let steps = p==="ios" ? ML.a2hsIos : ML.a2hsAndroid;
  /* iOS-Teilen-Icon als kleines Inline-SVG einsetzen, damit die Kundin es wiedererkennt */
  const shareSvg = `<svg class="a2hs-share" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v11M12 3l-3.2 3.2M12 3l3.2 3.2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 10.5H5.8A1.8 1.8 0 0 0 4 12.3v6.4A1.8 1.8 0 0 0 5.8 20.5h12.4A1.8 1.8 0 0 0 20 18.7v-6.4a1.8 1.8 0 0 0-1.8-1.8H17" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const bar = document.createElement("div");
  bar.className = "a2hs";
  const iosHint = p==="ios" ? ` ${shareSvg}` : "";
  bar.innerHTML = `
    <button class="a2hs-x" aria-label="✕">✕</button>
    <div class="a2hs-ico"><img src="icon-192.png" alt=""></div>
    <div class="a2hs-txt">
      <div class="a2hs-title">${ML.a2hsTitle}</div>
      <div class="a2hs-steps">${steps}${iosHint}</div>
    </div>`;
  bar.querySelector(".a2hs-x").onclick = ()=>{ a2hsMark(); bar.remove(); };
  container.appendChild(bar);
}
function m(){ return M[state.lang] || M.en; }

function render(){
  document.body.classList.toggle("rtl", state.lang && t().dir === "rtl");
  const p = (step==="done") ? 6 : (typeof step === "number") ? step : 1;
  [...progress.children].forEach((d,i)=>d.classList.toggle("on", i<=p));
  app.innerHTML = "";
  if(step===0) renderLang();
  else if(step===1) renderMenu();
  else if(step==="prices") renderPrices();
  else if(step==="question") renderQuestion();
  else if(step===2) renderService();
  else if(step===3) renderHair();
  else if(step===4) renderPeriod();
  else if(step==="done") renderDone();
  else renderSummary();
  window.scrollTo({top:0});
}

      <div id="wishArea"></div>

    </div>

    </div>

    <input type="file" id="wishInput" accept="image/*" style="display:none">`;
  const ta = el.querySelector("#hair");
  ta.oninput = ()=>{ state.hair = ta.value; el.querySelector("#next").disabled = !ta.value.trim(); };
  el.querySelector("#next").onclick = ()=>{ step=4; render(); };
  el.querySelector("#back").onclick = ()=>{ step=2; render(); };

  const PL = P[state.lang] || P.en;

  /* Wiederverwendbarer Foto-Slot: 'cur' = aktuelles Haar, 'wish' = Wunschergebnis */
  function makeSlot(kind){
    const isCur = kind==="cur";
    const area  = el.querySelector(isCur ? "#curArea" : "#wishArea");
    const input = el.querySelector(isCur ? "#curInput" : "#wishInput");
    const dataKey = isCur ? "photoData" : "wishData";
    const urlKey  = isCur ? "photoUrl"  : "wishUrl";
    const title = isCur ? PL.curTitle : PL.wishTitle;
    const sub   = isCur ? PL.curSub   : PL.wishSub;
    const optFlag = (isCur && s.photo) ? "" : " · "+PL.optional; // Ist-Foto bei Foto-Services nicht als optional labeln
    function draw(){
      if(state[dataKey]){
        area.innerHTML = `
          <div class="photo-preview">
            <img src="${state[dataKey]}" alt="">
            <button class="pp-remove" aria-label="✕">✕</button>
            <button class="pp-change">${PL.change}</button>
          </div>`;
        area.querySelector(".pp-remove").onclick = ()=>{ state[dataKey]=null; state[urlKey]=null; draw(); };
        area.querySelector(".pp-change").onclick = ()=>input.click();
      } else {
        area.innerHTML = `
          <button class="photo-box" type="button">
            <span class="pb-ico">${isCur?"📷":"✨"}</span>
            <span class="pb-txt">
              <span class="pb-title">${title}${optFlag}</span>

        area.querySelector(".photo-box").onclick = ()=>input.click();
      }
    }
    input.onchange = ()=>{
      const f = input.files[0];
      if(!f) return;
      shrinkImage(f).then(dataUrl=>{ buzz(10); state[dataKey]=dataUrl; state[urlKey]=null; draw(); });
    };
    draw();
  }
  makeSlot("cur");
  makeSlot("wish");
  app.appendChild(el);
  ta.focus();
}

/* ── Schritt 3: Zeitraum ── */
/* ── Verfügbarkeits-Helfer ── */
function parseISO(d){ const [y,m,day]=d.split("-").map(Number); return new Date(y, m-1, day); }
function todayMidnight(){ const t=new Date(); return new Date(t.getFullYear(), t.getMonth(), t.getDate()); }
function fmtDate(iso){
  const loc = {de:"de-DE",fr:"fr-FR",en:"en-GB",es:"es-ES",nl:"nl-NL",da:"ar-MA"}[state.lang]||"en-GB";
  try{ return parseISO(iso).toLocaleDateString(loc,{day:"numeric",month:"long"}); }
  catch(e){ return iso; }
}
/* Aktives Fenster (heute drin) oder das nächste kommende; sonst null */
function currentWindow(){
  const today = todayMidnight();
  const sorted = [...AVAIL].filter(w=>w&&w.von&&w.bis).sort((a,b)=>a.von<b.von?-1:1);
  for(const w of sorted){ if(today>=parseISO(w.von) && today<=parseISO(w.bis)) return {...w, active:true}; }
  for(const w of sorted){ if(today<parseISO(w.von)) return {...w, active:false}; }
  return null;
}

/* Countdown-Text fürs Menü: Tage bis Fensterende bzw. bis Fensterbeginn.
   Gibt {text, kind} zurück oder null, wenn keine Fenster hinterlegt sind. */
function countdownInfo(){
  const win = currentWindow();
  if(!win) return null;
  const ML = m();
  const MS = 86400000;
  const today = todayMidnight();
  if(win.active){
    const days = Math.round((parseISO(win.bis) - today)/MS);
    if(days<=0) return {text:ML.cdLast, kind:"last"};
    return {text:ML.cdHere(days), kind:"here"};
  } else {
    const days = Math.round((parseISO(win.von) - today)/MS);
    return {text:ML.cdSoon(days), kind:"soon"};
  }
}

function renderPeriod(){
  const L = t();
  const win = currentWindow();
  const el = document.createElement("section");
  el.className = "step active";

  // Info-Zeile je nach Situation
  let info = "";
  if(win && win.active) info = `<p class="avail-info here">${L.perHere(fmtDate(win.von), fmtDate(win.bis))}</p>`;
  else if(win)          info = `<p class="avail-info soon">${L.perSoon(fmtDate(win.von), fmtDate(win.bis))}</p>`;
  else                  info = `<p class="avail-info away">${L.perAway}</p>`;

  // Datumsgrenzen (auf Moes Fenster begrenzt; ohne Fenster kein Limit)
  const min = win ? win.von : "";
  const max = win ? win.bis : "";
  const liveSel = state.period===L.perLive;

  el.innerHTML = `
    <h2 class="step-title">${L.perTitle}</h2>
    <p class="step-sub">${L.perSub}</p>
    ${info}
    <div class="step-body" id="dateBody" style="${liveSel?'opacity:.4;pointer-events:none':''}">
      <div class="date-row">
        <label class="date-field"><span>${L.perFrom}</span>
          <input type="date" id="dFrom" ${min?`min="${min}"`:""} ${max?`max="${max}"`:""} value="${state.dFrom||""}">
        </label>
        <label class="date-field"><span>${L.perTo}</span>
          <input type="date" id="dTo" ${min?`min="${min}"`:""} ${max?`max="${max}"`:""} value="${state.dTo||""}">
        </label>
      </div>
    </div>
    <button class="chip live-chip ${liveSel?'selected':''}" id="liveChip" style="margin-top:12px">${L.perLive}</button>
    <div class="actions">
      <button class="btn btn-primary" id="next" disabled>${L.next}</button>
      <button class="btn btn-ghost" id="back">${L.back}</button>
    </div>`;

  const dFrom = el.querySelector("#dFrom");
  const dTo   = el.querySelector("#dTo");
  const nextBtn = el.querySelector("#next");
  const liveChip = el.querySelector("#liveChip");
  const dateBody = el.querySelector("#dateBody");

  function syncNext(){
    if(state.period===L.perLive){ nextBtn.disabled=false; return; }
    nextBtn.disabled = !(state.dFrom && state.dTo);
  }
  function composePeriod(){
    if(state.dFrom && state.dTo){
      state.period = `${fmtDate(state.dFrom)} – ${fmtDate(state.dTo)}`;
    } else state.period = "";
  }
  dFrom.onchange = ()=>{
    state.dFrom = dFrom.value;
    if(state.dTo && state.dTo < dFrom.value){ state.dTo = dFrom.value; dTo.value = dFrom.value; }
    dTo.min = dFrom.value || min;
    composePeriod(); syncNext();
  };
  dTo.onchange = ()=>{
    state.dTo = dTo.value;
    composePeriod(); syncNext();
  };
  liveChip.onclick = ()=>{
    if(state.period===L.perLive){
      state.period=""; liveChip.classList.remove("selected");
      dateBody.style.opacity=""; dateBody.style.pointerEvents="";
    } else {
      state.period=L.perLive; state.dFrom=""; state.dTo="";
      dFrom.value=""; dTo.value="";
      liveChip.classList.add("selected");
      dateBody.style.opacity=".4"; dateBody.style.pointerEvents="none";
    }
    syncNext();
  };

  nextBtn.onclick = ()=>{ step=5; render(); };
  el.querySelector("#back").onclick = ()=>{ step=3; render(); };
  app.appendChild(el);
  syncNext();
}

function buildWaText(){
  const s = currentService();
  const w = WA[state.lang] || WA.en;
  const lines = [
    w.greet,
    ``,
    `${w.lService}: ${svcName(s)}`,
    `${w.lPeriod}: ${state.period}`,
    `${w.lHair}: ${state.hair}`,
  ];
  if(state.photoUrl) lines.push(`📷 ${w.lPhoto}: ${state.photoUrl}`);
  else if(state.photoData || s.photo) lines.push(w.photoNote);
  if(state.wishUrl) lines.push(`✨ ${w.lWish}: ${state.wishUrl}`);
  if(state.name && state.name.trim()) lines.push(``, `– ${state.name.trim()}`);
  return lines.join("\n");
}

function buildWaLink(){
  return `https://wa.me/${MOE_WHATSAPP}?text=${encodeURIComponent(buildWaText())}`;
}

/* Bild clientseitig verkleinern (max. 1280 px), damit der Upload schnell bleibt */
function shrinkImage(file){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const max = 1280;
      let w = img.width, h = img.height;
      if(w>max||h>max){ const f = max/Math.max(w,h); w=Math.round(w*f); h=Math.round(h*f); }
      const c = document.createElement("canvas");
      c.width=w; c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL("image/jpeg",.82));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("read")); };
    img.src = url;
  });
}

/* Upload zu imgbb → liefert die Bild-URL zurück */
async function uploadToImgbb(dataUrl){
  const base64 = dataUrl.split(",")[1];
  const fd = new FormData();
  fd.append("image", base64);
  const res = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {method:"POST", body:fd});
  if(!res.ok) throw new Error("upload");
  const json = await res.json();
  if(!json.success) throw new Error("upload");
  return json.data.url;
}

/* Optionales Sheet-Logging via Make-Webhook.
   Fire-and-forget: Fehler hier dürfen das Senden NIE aufhalten. */
function logToSheet(){
  if(!MAKE_WEBHOOK) return;
  const s = currentService();
  try{
    fetch(MAKE_WEBHOOK, {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        timestamp: new Date().toISOString(),
        source: "yara_web",
        source_token: "yara_web_v1",
        language_code: state.lang,
        selected_service: s.name.de,
        service_id: s.id,
        hair_info: state.hair,
        preferred_date: state.period,
        photo_url: state.photoUrl || "",
        wish_photo_url: state.wishUrl || "",
        customer_name: (state.name||"").trim(),
        customer_phone: "",
        whatsapp_message: buildWaText(),
        conversation_status: "REQUEST_SENT"
      })
    }).catch(()=>{});
  }catch(e){}
}

function esc(str){
  return str.replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
